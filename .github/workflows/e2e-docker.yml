---
name: E2E Tests (Docker)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        run: |
          docker --version
          docker-compose --version

      - name: Build Docker images
        run: docker-compose -f docker-compose.e2e.yml build

      - name: Start services
        run: |
          docker-compose -f docker-compose.e2e.yml up -d server client
          echo "Waiting for server to be healthy..."
          for i in {1..30}; do
            if docker-compose -f docker-compose.e2e.yml exec -T server curl -f http://localhost:3001/api/choreographies?limit=1 > /dev/null 2>&1; then
              echo "Server is healthy"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Run E2E tests
        run: docker-compose -f docker-compose.e2e.yml run --rm e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: client/playwright-results/
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: client/playwright-results/junit.xml
          check_name: E2E Test Results

      - name: Clean up
        if: always()
        run: docker-compose -f docker-compose.e2e.yml down -v
