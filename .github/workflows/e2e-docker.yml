---
name: E2E Tests (Docker)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  checks: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker Compose is available
        run: |
          echo "Docker version:"
          docker --version
          echo "Docker Compose version:"
          docker compose version

      - name: Build Docker images
        run: docker compose -f docker-compose.e2e.yml build

      - name: Start server and client services
        run: docker compose -f docker-compose.e2e.yml up -d --wait server client

      - name: Run E2E tests
        run: docker compose -f docker-compose.e2e.yml run --rm e2e

      - name: Check test results directory
        if: always()
        run: |
          echo "Test results location:"
          ls -la client/playwright-results/ 2>/dev/null || echo "⚠ No results directory found"
          echo ""
          echo "Looking for XML files:"
          find client -name "*.xml" -type f 2>/dev/null || echo "⚠ No XML files found"
          echo ""
          echo "Docker containers status:"
          docker compose -f docker-compose.e2e.yml ps

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: client/playwright-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish test results
        if: always()
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: client/playwright-results/junit.xml
          check_name: E2E Test Results

      - name: Show logs on failure
        if: always()
        run: |
          echo "=== Server logs ==="
          docker compose -f docker-compose.e2e.yml logs server --tail 50 || true
          echo ""
          echo "=== Client logs ==="
          docker compose -f docker-compose.e2e.yml logs client --tail 50 || true
          echo ""
          echo "=== E2E test logs ==="
          docker compose -f docker-compose.e2e.yml logs e2e --tail 100 || true

      - name: Clean up containers
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true
