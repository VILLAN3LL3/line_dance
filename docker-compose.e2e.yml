services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: line_dance_server
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: test
    volumes:
      - ./raw_data:/app/raw_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/openapi.json"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 30s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.preview
    container_name: line_dance_client
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    environment:
      VITE_API_URL: http://server:3001/api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 15s

  e2e:
    image: mcr.microsoft.com/playwright:v1.48.0-focal
    container_name: line_dance_e2e
    working_dir: /app
    entrypoint: sh
    command: >
      -c "
      npm ci &&
      npx playwright test --reporter=html,junit
      "
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "false"
      DOCKER_ENV: "1"
      CI: "true"
      VITE_API_URL: http://server:3001/api
    volumes:
      - ./client:/app
