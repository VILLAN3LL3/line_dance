services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: line_dance_server
    environment:
      PORT: 3001
      NODE_ENV: test
      # Fresh, isolated databases per run (same as the local Playwright webServer).
      CHOREOGRAPHY_DB_PATH: ":memory:"
      DANCE_GROUPS_DB_PATH: ":memory:"
      TAGS_DB_PATH: ":memory:"
    volumes:
      - ./raw_data:/app/raw_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/openapi.json"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 30s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.preview
    container_name: line_dance_client
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 45s

  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    container_name: line_dance_e2e
    # Share the client's network namespace so the app is served from http://localhost:3000.
    # Browsers only expose crypto.randomUUID (used by the app) in secure contexts, and
    # http://client:3000 is not one. The server is still reachable as "server".
    network_mode: "service:client"
    working_dir: /app
    entrypoint: sh
    # Reporters (incl. junit.xml) come from playwright.config.ts when CI is set.
    command: -c "npm ci && npx playwright test"
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      DOCKER_ENV: "1"
      CI: "true"
      E2E_API_URL: http://server:3001/api
    volumes:
      - ./client:/app
      # Keep container-installed deps off the host so npm ci never touches local node_modules.
      - /app/node_modules
