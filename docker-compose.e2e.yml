version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: line_dance_server
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: test
    volumes:
      - ./raw_data:/app/raw_data
      - ./server:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/choreographies?limit=1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.e2e
    container_name: line_dance_client
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    environment:
      VITE_API_BASE: http://server:3001/api
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/dist

  e2e:
    build:
      context: ./client
      dockerfile: Dockerfile.e2e
    container_name: line_dance_e2e
    working_dir: /app
    command: npx playwright test --reporter=html,junit
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_started
    environment:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "false"
      DOCKER_ENV: "1"
      CI: "true"
      VITE_API_URL: http://server:3001/api
      PLAYWRIGHT_TIMEOUT: "60000"
    volumes:
      - ./client:/app
      - ./client/playwright-results:/app/playwright-results
